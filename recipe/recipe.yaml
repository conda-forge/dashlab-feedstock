schema_version: 1

context:
  name: dashlab
  version: "0.3.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dashlab-${{ version }}.tar.gz
  sha256: 279f2adc524a1914918f893deec0586caedf67bd73c72a078bf1f6c75a9586b0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - anywidget
    - markdown

tests:
  - python:
      imports:
        - dashlab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/asaboor-gh/dashlab
  summary: A Python package for dashboard and data visualization tools.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
